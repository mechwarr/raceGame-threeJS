<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iframe 賽馬小遊戲 — 極簡載體 (PostMessage 控制)</title>
  <style>
    body {
      margin: 0;
      background: #0b0d12;
      /* 確保 body 填滿視口 */
      width: 100vw;
      height: 100vh; 
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 遊戲容器：設置為固定 16:9 比例，並位於畫面中央 */
    #game-root {
      position: relative;
      /* 這裡我們將寬度設為視窗寬度與高度的較小者，以確保 fit */
      width: min(100vw, calc(100vh * 16 / 9)); 
      height: min(100vh, calc(100vw * 9 / 16));
      margin: auto;
      overflow: hidden;
      background: #000;
    }

    #game-root iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    /* 確保 log 訊息可見 */
    #console-log {
        position: fixed;
        bottom: 0;
        left: 0;
        padding: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: limegreen;
        font-family: monospace;
        font-size: 10px;
        max-height: 50vh;
        overflow-y: auto;
        width: 100%;
        box-sizing: border-box;
        pointer-events: none; /* 讓 log 不會影響點擊 */
        white-space: pre-wrap;
        z-index: 100;
    }
  </style>
</head>

<body>
  <div id="game-root" aria-label="遊戲容器">
    </div>
  
  <!-- <pre id="console-log"></pre> -->

  <script src="./frameCore/iframe-game-utils.js"></script>
  <script src="./frameCore/iframe-game-core.js"></script>
  <script src="./demoGame.js"></script>

  <script>
    const root = document.getElementById('game-root');
    const logOutput = document.getElementById('console-log');
    
    // 自定義 Log 函數，將訊息輸出到 console 和 DOM
    function hostLog(...messages) {
        const timestamp = new Date().toLocaleTimeString();
        const msg = `[${timestamp}] [HOST] ${messages.join(' ')}\n`;
        console.log(...messages);
        
        if (logOutput) {
            logOutput.textContent += msg;
            // 保持滾動到底部
            logOutput.scrollTop = logOutput.scrollHeight;
        }
    }

    // 產生 12 位數字的 gameId
    function genGameId12() {
      if (window.crypto?.getRandomValues) {
        const arr = new Uint8Array(12);
        window.crypto.getRandomValues(arr);
        return Array.from(arr).map(b => (b % 10).toString()).join('');
      }
      let s = '';
      for (let i = 0; i < 12; i++) s += Math.floor(Math.random() * 10);
      return s;
    }

    function getRandomRank() {
        const numbers = Array.from({ length: 11 }, (_, i) => i + 1);
        for (let i = numbers.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
        }
        return numbers.slice(0, 5);
    }
    
    // ★★★ 核心：監聽外部 PostMessage 指令 (唯一的控制方式) ★★★
    function onHostCommand(event) {
        // 確保來源是來自同一個 window
        if (event.source !== window || event.origin !== window.location.origin) return;

        const msg = event.data;
        if (!msg || typeof msg !== 'object' || !msg.type || !msg.type.startsWith('cmd:')) return;
        
        const game = RaceGame.GetGame();
        if (!game) {
            hostLog('[Host Cmd] 遊戲尚未建立或已銷毀，指令無效:', msg.type);
            return;
        }

        hostLog(`[Host Cmd] 收到指令: ${msg.type}`, msg.payload);
        
        switch (msg.type) {
            case 'cmd:start':
                const payload = msg.payload || {};
                const gameId = payload.gameId || genGameId12(); 
                const rank = payload.rank || getRandomRank(); 
                const countdown = payload.countdown ?? 3;
                
                game.StartGame(gameId, rank, countdown);
                break;

            case 'cmd:pause':
                game.PauseGame();
                break;

            case 'cmd:end':
                game.DisposeGame();
                // 結束後可以選擇自動重啟
                hostLog('[Host Cmd] 遊戲結束並銷毀。準備重新建立...');
                autoCreateGame(); 
                break;
        }
    }
    window.addEventListener('message', onHostCommand);


    // ★★★ 核心：自動建立遊戲 ★★★
    async function autoCreateGame() {
        hostLog('[Init] 正在自動建立遊戲...');
        
        // 移除 loadingRefs 參數，因為相關 DOM 元素已不存在
        await RaceGame.Create({
            container: root,
            src: './game/game.html',
            targetOrigin: window.location.origin,
            platformId: 'MINIMAL_HOST', // 設定平台 ID
            sandbox: 'allow-scripts allow-same-origin',
            attributes: { allow: 'fullscreen; gamepad; xr-spatial-tracking; autoplay' },
            // loadingRefs 已移除
            onGameMessage: (type, payload) => {
                hostLog(`[Game Event] ${type} | State: ${RaceGame.GetGame()?.state}`, payload);
            },
            onStateChange: (state) => {
                hostLog(`[State Change] Host State -> ${state}`);
                // 在 ready 時可以提示用戶發送 postMessage 開始遊戲
                if (state === 'ready') {
                     hostLog('----- 遊戲已就緒 (Ready)! -----');
                     hostLog('請在 Console 執行指令開始遊戲:');
                     hostLog("window.postMessage({ type: 'cmd:start', payload: { rank: [1,2,3,4,5], countdown: 3 } }, '*')");
                }
            }
        });
        hostLog('[Init] 遊戲容器建立完成。等待 Iframe 內部資源載入...');
    }
    
    // 頁面載入後自動執行
    window.addEventListener('load', autoCreateGame);

  </script>
</body>

</html>
